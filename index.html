<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <title>Vässarö AIS</title>
    <link rel="icon" type="image/x-icon" href="img/vassaro_kvadrat.jpeg">
    <meta charset="utf-8" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotatedmarker@0.2.0/leaflet.rotatedMarker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-geometryutil@0.10.1/src/leaflet.geometryutil.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="src/leaflet.nauticalscale.js"></script>

    <link rel="stylesheet" href="style.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>

<body>
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="./">
                <img src="img/vassaro_logga.jpg">&nbsp;Vässarö AIS
                <!-- <i class="fa-solid fa-anchor"></i>&nbsp;Vässarö AIS -->
            </a>

            <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navMenu">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>


        </div>
        <div class="navbar-menu" id="navMenu">
            <div class="navbar-end">
                <div class="navbar-item has-dropdown is-hoverable">
                    <a class="navbar-link hidden-mobile">
                        <i class="fa-solid fa-ship"></i>&nbsp;Markers
                    </a>
                    <div class="navbar-dropdown is-right">
                        <div class="navbar-item is-flex is-align-items-center">
                            <label class="custom-switch">
                                <input type="checkbox" id="showAllShipsSwitch">
                                <span class="custom-slider"></span>
                            </label>Visa alla fartyg</span>
                        </div>
                        <div class="navbar-item is-flex is-align-items-center">
                            <label class="custom-switch">
                                <input type="checkbox" id="showStationarySwitch">
                                <span class="custom-slider"></span>
                            </label>Visa fasta punkter
                        </div>
                        <div class="navbar-item is-flex is-align-items-center">
                            <label class="custom-switch">
                                <input type="checkbox" id="showOfflineBoatsSwitch" checked>
                                <span class="custom-slider"></span>
                            </label>Visa offline Vässaröfartyg
                        </div>
                        <div class="navbar-item">
                            <div class="table-container" style="max-height: 500px; overflow: scroll;">
                                <table class="table is-striped is-fullwidth">
                                    <thead>
                                        <th colspan="5" style="text-align: center; background-color: #f5f5f5;">Fartyg</th>
                                        <tr>
                                            <th>Namn</th>
                                            <th>Fart</th>
                                            <th>Kurs</th>
                                            <th colspan="2">Senast sedd</th>
                                        </tr>
                                    </thead>
                                    <tbody id="shipTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                        <hr class="navbar-divider">
                        <div class="navbar-item">
                            <div class="content">
                                <p>
                                    Den här hemsidan bor på
                                    <a href="https://github.com/JR3hn/AIS">
                                        Github <i class="fa-brands fa-github"></i>
                                    </a>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div id="map"></div>

    <div id="history-duration-modal" class="modal">
        <div class="modal-background" onclick="closeDurationModal()"></div>
        <div class="modal-content">
            <div class="box has-text-centered">
                <h3 class="title is-5 mb-2">Välj tidsintervall</h3>
                <p class="mb-4">Hur lång historik vill du ladda för <strong id="modal-ship-name"></strong>?</p>
                <div class="buttons is-centered">
                    <button class="button is-link" onclick="startHistoryLoading('12h')">12h</button>
                    <button class="button is-link" onclick="startHistoryLoading('24h')">24h</button>
                    <button class="button is-link" onclick="startHistoryLoading('48h')">48h</button>
                </div>
                <div class="buttons is-centered">
                    <button class="button is-warning is-light" onclick="startHistoryLoading('exact')">Exakt data 48h (Kan ta längre tid)</button>
                </div>
            </div>
        </div>
        <button class="modal-close is-large" aria-label="close" onclick="closeDurationModal()"></button>
    </div>

    <div id="history-controls" class="box" style="display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 600px;">
        <div class="is-flex is-justify-content-space-between is-align-items-center mb-2">
            <h3 class="title is-5 is-marginless" id="history-title">Historik</h3>
            <button class="button is-small is-danger" onclick="exitHistoryMode()">
                <i class="fa-solid fa-times"></i>&nbsp;Stäng
            </button>
        </div>

        <div class="field">

        <div class="field">
            <div class="is-flex is-justify-content-space-between mb-1">
                <label class="label" id="history-time-label">Tidpunkt</label>
                <span class="tag is-light">Nu</span>
            </div>
            
            <div class="control" style="width: 100%; display: flex; align-items: center; gap: 10px;">
                <button class="button is-small" onclick="stopPlayback(); stepHistory(-1)">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <!-- Slider Container -->
                <div style="position: relative; flex-grow: 1; height: 24px; display: flex; align-items: center;">
                    <!-- Bakgrundsgrafik för data/hål -->
                    <div id="slider-gradient" style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; background: #eee; width: 100%; top: 50%; transform: translateY(-50%);"></div>

                    <!-- Slider -->
                    <input
                        id="history-slider"
                        class="slider"
                        style="width: 100%; position: absolute; background: transparent; -webkit-appearance: none; appearance: none; margin: 0; cursor: pointer;"
                        step="1"
                        type="range"
                        oninput="stopPlayback(); updateHistoryFromSlider(this.value)"
                        onchange="snapHistorySlider(this.value)"
                    >
                </div>

                <button class="button is-small" onclick="stopPlayback(); stepHistory(1)">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button class="button is-small is-primary" id="play-button" onclick="togglePlayback()">
                    <i class="fa-solid fa-play" id="play-icon"></i>
                </button>
            </div>
            <div class="is-flex is-align-items-center is-justify-content-center mt-2" style="gap: 6px;">
                <span class="is-size-7 has-text-grey">Intervall:</span>
                <div id="speed-buttons" class="tags mb-0" style="gap: 4px;"></div>
            </div>
        </div>
        <div class="tags has-addons is-justify-content-center">
            <span class="tag">Fart</span>
            <span class="tag is-primary" id="history-speed">-</span>
            <span class="tag">Kurs</span>
            <span class="tag is-info" id="history-course">-</span>
        </div>
    </div>

</body>

<script>

    // LEAFLET MAP
    const BASEMAPS = {
        OpenStreetMap: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors.</a>.'
        }),
        Satellit: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; <a href="https://www.arcgis.com/home/item.html?id=10df2279f9684e4a9f6a7f08febac2a9">Esri, Maxar, Earthstar Geographics, and the GIS User Community</a>.'
        })
    };


    const SOUTH_WEST = L.latLng(55.3, 10.0);
    const NORTH_EAST = L.latLng(69.0, 24.5);
    const BOUNDS = L.latLngBounds(SOUTH_WEST, NORTH_EAST);

    // Kartan börjar centrerad runt Strömsviken - Djuphamn
    var lfmap = L.map('map', {
        center: [60.24521, 18.68388],
        zoom: 13,
        minZoom: 8,
        maxBounds: BOUNDS,
        maxBoundsViscosity: 1.0,
        zoomControl: false,
        layers: [BASEMAPS.OpenStreetMap]
    });

    L.control.layers(BASEMAPS, null, { position: 'bottomright' }).addTo(lfmap);

    const SCALE = new L.control.scaleNautical({
        maxWidth: 300,
        nauticalMilesUnit: "sjömil"
    }).addTo(lfmap);


    let showAllShips = false;
    let showStationary = false;
    let showOfflineBoats = true;
    const offlineBoats = new Set();

    document.getElementById('showAllShipsSwitch').addEventListener('change', function (event) {
        showAllShips = event.target.checked;
        redrawAllMarkers();
    });

    document.getElementById('showStationarySwitch').addEventListener('change', function (event) {
        showStationary = event.target.checked;
        redrawAllMarkers();
    });

    document.getElementById('showOfflineBoatsSwitch').addEventListener('change', function (event) {
        showOfflineBoats = event.target.checked;
        redrawAllMarkers();
    });

    lfmap.on('baselayerchange', function (e) {
       if (e.name === 'Satellit') {
           document.documentElement.style.setProperty('--accent-color', '#e1e1e1');
           if (historyPath) {
               historyPath.setStyle({ color: 'rgba(255, 255, 255, 0.4)' });
           } 
       } else {
           document.documentElement.style.setProperty('--accent-color', '#003660');
           if (historyPath) {
               historyPath.setStyle({ color: 'rgba(0, 110, 0, 0.4)' });
           } 
       }
    });

    function redrawAllMarkers() {
        // Ta bort alla nuvarande markörer och vektorer
        Object.values(shipMarkers).forEach(marker => lfmap.removeLayer(marker));
        Object.values(shipVectors).forEach(vector => lfmap.removeLayer(vector));
        shipMarkers = {};
        shipVectors = {};
        // Lägg till markörer igen enligt nya filtret
        Object.values(shipLastUpdate).forEach(message => {
            createMarker(message);
        });
    }

    // WEB SOCKET
    const ws = new WebSocket("wss://jumpgate.vassaro.net/ws/");

    var shipLastUpdate = {};

    let historyMarker = null;
    let historyPath = null;
    let historyVector = null;

    async function fetchLatestAndAddOfflineBoats() {
        try {
            const response = await fetch('https://jumpgate.vassaro.net/ais/data/latest');
            if (!response.ok) return;
            const vessels = await response.json();

            vessels.forEach(vessel => {
                const mmsiStr = String(Math.round(parseFloat(vessel.mmsi) || 0));
                const shipName = MMSI_NAME_MAP[mmsiStr];
                if (!shipName) return;
                if (shipLastUpdate[shipName]) return;
                if ((vessel.speed || 0) >= 0.5) return;
                if (vessel.latitude == null || vessel.longitude == null) return;

                let ts = vessel.timestamp;
                if (ts && typeof ts === 'string' && !ts.endsWith('Z') && !ts.includes('+')) ts += 'Z';

                const message = {
                    name: shipName,
                    mmsi: vessel.mmsi,
                    coordinates: [vessel.latitude, vessel.longitude],
                    speed: vessel.speed || 0,
                    course: vessel.course || 0,
                    lastSeen: ts ? new Date(ts) : null
                };
                offlineBoats.add(shipName);
                shipLastUpdate[shipName] = message;
                createMarker(message);
            });
        } catch (e) {
            console.error('Failed to fetch latest positions:', e);
        }
    }

    ws.onmessage = (event) => {
        if (event.data.startsWith('42["vesselPositions-init"')) {
            const vessels = JSON.parse(event.data.toString().slice(2))[1];
            vessels.forEach(message => {
                const shipName = message.name && message.name.trim();
                if (!shipName) return;
                if (!shipLastUpdate[shipName]) {
                    message.lastSeen = new Date();
                    createMarker(message);
                    shipLastUpdate[shipName] = message;
                }
            });
            fetchLatestAndAddOfflineBoats();
        } else {
            const message = JSON.parse(event.data.toString().slice(2))[1];
            const shipName = message.name && message.name.trim();
            if (shipName) {
                message.lastSeen = new Date();
                shipLastUpdate[shipName] = message;
            }
            createMarker(message);
        }
    };

    ws.onclose = (event) => {
        console.log("Connection closed", event.code, event.reason, event.wasClean)
    };

    ws.onerror = () => {
        console.log("Connection closed due to error");
        alert("Vi får ingen kontakt med Vässarö...");
    };


    const arrowIcon = L.icon({
        iconUrl: 'img/Boat marker.svg',
        iconSize: [42, 42],
        iconAnchor: [21, 21], // mitten av ikonen
    });

    const stationaryIcon = L.icon({
        iconUrl: 'img/stationary.svg',
        iconSize: [42, 42],
        iconAnchor: [21, 42], // botten av ikonen
    });

    const locationIcon = L.divIcon({
        html: '<i style="color: var(--harbor-color)" class="fa-solid fa-location-crosshairs fa-2x"></i>',
        iconSize: [42, 42],
        iconAnchor: [21, 21], // mitten av ikonen
        className: "locationIcon"
    });

    const HARBORS = [
        ["Djuphamn", [60.259901, 18.691059]],
        ["Fladan", [60.261266, 18.698441]],
        ["Strömsviken", [60.216261, 18.725735]],
        ["Öregrund", [60.340856, 18.442161]],
        ["Äspskär", [60.30136, 18.59455]],
        ["Sundsveden", [60.251664, 18.60996]]
    ]

    HARBORS.forEach(harbor => {
        // console.log(harbor)
        const harbourMarker = L.marker(harbor[1], {
            icon: locationIcon,
            title: harbor[0]
        })
            .bindPopup(harbor[0], {
                offset: [0, -10],
                className: "shipPopup",
            })
            .addTo(lfmap);
    });

    // CREATE MARKERS, filtered by MMSI
    const MMSI_NAME_MAP = {
        "265759010": "VIGGEN",
        "265575820": "MASEN",
        "265575840": "GRISSLAN VASSARO",
        "265060020": "BULLRET VASSARO",
        "265672200": "TARNAN VASSARO"
    };

    var shipMarkers = {};

    var shipVectors = {};

    function formatName(name) {
        var splitString = name.toLowerCase().split(" ");
        for (var i = 0; i < splitString.length; i++) {
            splitString[i] = splitString[i].charAt(0).toUpperCase() + splitString[i].substring(1);
        }
        return splitString.join(" ");
    }

    function createMarker(message) {
        if (isHistoryMode) return;
        if (!message.coordinates || !message.name) return;
        const shipName = message.name.split(/[!\[]/)[0].trim();
        const mmsi = message.mmsi || "";

        const infoHTML = `
            <table>
                <thead>
                    <tr>
                        <td style="font-weight: bold;"><i class="fa-solid fa-ship"></i></td>
                        <td style="font-weight: bold;">${formatName(shipName) || "<i>Inget namn...</i>"}</td>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Fart:</td>
                        <td>${message.speed + " knop" || "-"}</td>
                    </tr>
                    <tr>
                        <td>Kurs:</td>
                        <td>${message.course || "-"}&deg;</td>
                    </tr>
                    <tr>
                        <td>Status:</td>
                        <td>${message.navigationalStatus || "-"}</td>
                    </tr>
                    <tr>
                        <td>Legend:</td>
                        <td>${message.legend || "-"}</td>
                    </tr>
                    <tr>
                        <td>Koordinater:</td>
                        <td>N${parseFloat(message.coordinates[0]).toFixed(5)}, E${parseFloat(message.coordinates[1]).toFixed(5)}</td>
                    </tr>
                    <tr>
                        <td>Senast sedd:</td>
                        <td>${new Date(message.lastSeen).toLocaleString("sv-se") || "-"}</td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center; padding-top: 10px;">
                            <button class="button is-small is-link is-outlined" onclick="promptHistoryDuration('${mmsi}', '${shipName}')">
                                <span class="icon"><i class="fa-solid fa-clock-rotate-left"></i></span>
                                <span>Se Historik</span>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        `;

        const statInfoHTML = `
            <table>
                <thead>
                    <tr>
                        <td style="font-weight: bold;"><i class="fa-solid fa-ship"></i></td>
                        <td style="font-weight: bold;">${formatName(shipName) || "<i>Inget namn...</i>"}</td>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Koordinater:</td>
                        <td>N${parseFloat(message.coordinates[0]).toFixed(5)}, E${parseFloat(message.coordinates[1]).toFixed(5)}</td>
                    </tr>
                </tbody>
            </table>
        `;
        

        const isConsideredFixed = isFixed(shipName, message);
        const mmsiStr = String(Math.round(parseFloat(mmsi) || 0));
        if (offlineBoats.has(shipName) && !showOfflineBoats) return;

        if (
            (
                showAllShips ||
                mmsiStr in MMSI_NAME_MAP ||
                shipName.toUpperCase().includes("RESCUE") ||
                shipName.toUpperCase().includes("VASSARO") ||
                isConsideredFixed
            )
        ) {

            if (isConsideredFixed && !showStationary) {
                return;
            }               

            const currentIcon = isConsideredFixed ? stationaryIcon : arrowIcon;
            const currentHTML = isConsideredFixed ? statInfoHTML : infoHTML;

            // console.log(message)
            if (shipMarkers[shipName]) {
                shipMarkers[shipName]
                    .setLatLng(message.coordinates)
                    .setRotationAngle(isConsideredFixed ? 0 : (message.course || 0))
                    .setIcon(currentIcon)
                    .setPopupContent(currentHTML)
            } else {
                const marker = L.marker(message.coordinates, {
                    rotationAngle: isConsideredFixed ? 0 : (message.course || 0),
                    icon: currentIcon
                });
                marker.bindPopup(currentHTML, {
                    offset: [0, -10],
                    className: "shipPopup",
                });

                marker.bindTooltip(`${formatName(shipName) || "<i>Inget namn...</i>"}`, {
                    offset: [20, 0],
                    permanent: true,
                    interactive: true
                }).openTooltip();

                marker.addTo(lfmap);
                shipMarkers[shipName] = marker;
            }

            // CREATE PREDICTING VECTOR
            if (shipVectors[shipName]) {
                lfmap.removeLayer(shipVectors[shipName]);
            }
            if (typeof message.course === "number" && typeof message.speed === "number" && message.speed > 0.5) {
                const distance = message.speed * 100;

                // Skapa LatLng-objekt
                const startPoint = L.latLng(message.coordinates[0], message.coordinates[1]);
                const bearing = message.course;

                // Beräkna endpoint (distans i meter)
                const endPoint = L.GeometryUtil.destination(startPoint, bearing, distance);

                const start = [startPoint.lat, startPoint.lng];
                const end = [endPoint.lat, endPoint.lng];

                const vectorGroup = L.layerGroup();

                // Svart outline (bredare)
                const outline = L.polyline([start, end], {
                    color: 'black',
                    weight: 7,
                    opacity: 1
                });
                vectorGroup.addLayer(outline);

                // Rosa linje (ovanpå)
                const polyline = L.polyline([start, end], {
                    color: '#D70077',
                    weight: 3,
                    opacity: 1
                });
                vectorGroup.addLayer(polyline);

                const circle = L.circleMarker(end, {
                    radius: 5,
                    color: 'black',
                    weight: 2,
                    fillColor: '#D70077',
                    fillOpacity: 1
                });
                vectorGroup.addLayer(circle);

                vectorGroup.addTo(lfmap);
                shipVectors[shipName] = vectorGroup;
            }
        }
        updateShipTable();
    };

    document.addEventListener('DOMContentLoaded', () => {

        // Get all "navbar-burger" elements
        const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);

        // Add a click event on each of them
        $navbarBurgers.forEach(el => {
            el.addEventListener('click', () => {

                // Get the target from the "data-target" attribute
                const target = el.dataset.target;
                const $target = document.getElementById(target);

                // Toggle the "is-active" class on both the "navbar-burger" and the "navbar-menu"
                el.classList.toggle('is-active');
                $target.classList.toggle('is-active');

            });
        });
    });

    //Playback speeds in seconds between each step
    const PLAYBACK_SPEEDS = [0.05, 0.1, 0.5, 1, 2];

    let historyData = [];
    let historyLayerGroup = L.layerGroup();
    let isHistoryMode = false;
    let currentHistoryShipName = "";
    let isPlaying = false;
    let playbackInterval = null;
    let playbackSpeedIndex = 1; // default: index 1 = 1s

    let historyDurationHours = 12;
    let pendingHistoryMmsi = null;
    let pendingHistoryShipName = "";

    const GAP_THRESHOLD = 30 * 60 * 1000; // 30 minuter

    function getHistoryCutoffTime() {
        return Date.now() - (historyDurationHours * 60 * 60 * 1000);
    }

    function promptHistoryDuration(mmsi, shipName) {
        if (!mmsi) {
            alert("Inget MMSI hittades för detta fartyg.");
            return;
        }
        pendingHistoryMmsi = mmsi;
        pendingHistoryShipName = shipName;
        document.getElementById('modal-ship-name').innerText = formatName(shipName);
        document.getElementById('history-duration-modal').classList.add('is-active');
        lfmap.closePopup();
    }

    function closeDurationModal() {
        document.getElementById('history-duration-modal').classList.remove('is-active');
    }

    function startHistoryLoading(durationStr) {
        closeDurationModal();
        if (durationStr === 'exact') {
            historyDurationHours = 48;
        } else {
            historyDurationHours = parseInt(durationStr.replace('h', ''));
        }
        loadShipHistory(pendingHistoryMmsi, pendingHistoryShipName, durationStr);
    }

    async function loadShipHistory(mmsi, shipName, durationStr) {
        isHistoryMode = true;
        redrawAllMarkers();

        document.getElementById('history-title').innerText = `Laddar historik för ${formatName(shipName)}...`;
        document.getElementById('history-controls').style.display = 'block';

        try {
            let url;
            if (durationStr === 'exact') {
                url = `https://jumpgate.vassaro.net/ais/data/${mmsi}`;
            } else {
                url = `https://jumpgate.vassaro.net/ais/data/${durationStr}/${mmsi}`;
            }
            
            const response = await fetch(url);
            if (!response.ok) throw new Error("Kunde inte hämta data");

            let data = await response.json();

            historyData = data.map(p => {
                let ts = p.timestamp || p.minute;
                if (ts && typeof ts === 'string' && !ts.endsWith('Z') && !ts.includes('+')) {
                    ts += 'Z';
                }
                return { ...p, timestamp: ts };
            }).filter(p => p.latitude != null && p.longitude != null);

            if (historyData.length === 0) {
                alert("Ingen historik hittades.");
                exitHistoryMode();
                return;
            }

            currentHistoryShipName = shipName;
            initializeHistoryMap(shipName);

        } catch (error) {
            console.error(error);
            alert("Hittade ingen historik.");
            exitHistoryMode();
        }
    }

    function initializeHistoryMap(shipName, startAtTime = null) {
        historyLayerGroup.addTo(lfmap);
        document.getElementById('history-title').innerText = formatName(shipName);
        historyLayerGroup.clearLayers();

        const durationHours = historyDurationHours;
        const cutoffTime = getHistoryCutoffTime();;

        const visibleData = historyData.filter(p => new Date(p.timestamp).getTime() >= cutoffTime);

        let segments = [];
        let currentSegment = [];

        if (visibleData.length > 0) {
            // Starta första segmentet
            currentSegment.push([visibleData[0].latitude, visibleData[0].longitude]);

            for (let i = 0; i < visibleData.length - 1; i++) {
                const t1 = new Date(visibleData[i].timestamp).getTime();
                const t2 = new Date(visibleData[i+1].timestamp).getTime();
                const nextLatLng = [visibleData[i+1].latitude, visibleData[i+1].longitude];

                if (t2 - t1 > GAP_THRESHOLD) {
                    // Spara nuvarande segment och börja ett nytt
                    segments.push(currentSegment);
                    currentSegment = [nextLatLng];
                } else {
                    // Inget hål
                    currentSegment.push(nextLatLng);
                }
            }
            // Spara sista segmentet
            segments.push(currentSegment);
        }

        const isSatellite = lfmap.hasLayer(BASEMAPS.Satellit);
        const pathColor = isSatellite ? 'rgba(255, 255, 255, 0.4)' : 'rgba(0, 110, 0, 0.4)';
        
        historyPath = L.polyline(segments, {
            color: pathColor,
            weight: 3,
            dashArray: '5, 10'
        }).addTo(historyLayerGroup);

        lfmap.fitBounds(historyPath.getBounds(), { padding: [50, 50] });
        
        let targetPoint = null;

        if (startAtTime && startAtTime >= cutoffTime) {
            const { point } = findNearestDataPoint(startAtTime);
            targetPoint = point;
        }
        
        if (!targetPoint && historyData.length > 0) {
            targetPoint = historyData[historyData.length - 1];
        }

        if (targetPoint) {
            historyMarker = L.marker([targetPoint.latitude, targetPoint.longitude], {
                icon: arrowIcon,
                zIndexOffset: 1000
            }).addTo(historyLayerGroup);
        }

        updateSliderRange();
        renderSpeedButtons();

        if (targetPoint) {
            const slider = document.getElementById('history-slider');
            slider.value = new Date(targetPoint.timestamp).getTime();
            updateHistoryUI_Render(targetPoint);
        }
    }

    function updateSliderRange() {
        // Kontrollera switchen
        const durationHours = historyDurationHours;
        const cutoffTime = getHistoryCutoffTime();
        
        const nowMs = new Date().getTime();
        const minMs = nowMs - (durationHours * 60 * 60 * 1000);
        
        const slider = document.getElementById('history-slider');
        const gradientBar = document.getElementById('slider-gradient');

        // Spara nuvarande värde
        const currentValue = parseInt(slider.value);

        // Uppdatera gränserna
        slider.min = minMs;
        slider.max = nowMs;

        if (currentValue < minMs) {
            slider.value = minMs;
            updateHistoryFromSlider(minMs);
        }

        if (historyData.length < 2) {
            gradientBar.style.background = '#ddd';
            return;
        }

        const totalDuration = nowMs - minMs;
        let gradientStops = [];

        let segments = [];

        let currentStart = new Date(historyData[0].timestamp).getTime();
        let lastTime = currentStart;

        if (currentStart > minMs) {
            segments.push({ start: minMs, end: currentStart, type: 'gap' });
        }

        for (let i = 0; i < historyData.length - 1; i++) {
            const t1 = new Date(historyData[i].timestamp).getTime();
            const t2 = new Date(historyData[i+1].timestamp).getTime();
            
            if (t2 < minMs) {
                currentStart = t2;
                lastTime = t2;
                continue;
            }
            
            if (t1 > nowMs) break;

            const diff = t2 - t1;

            if (diff > GAP_THRESHOLD) {
                if (t1 > currentStart) {
                    segments.push({ start: currentStart, end: t1, type: 'data' });
                }
                segments.push({ start: t1, end: t2, type: 'gap' });
                
                currentStart = t2;
            }
            
            lastTime = t2;
        }

        if (lastTime > currentStart) {
             segments.push({ start: currentStart, end: lastTime, type: 'data' });
        }

        if (lastTime < nowMs) {
            segments.push({ start: lastTime, end: nowMs, type: 'gap' });
        }
        
        segments.forEach(seg => {
            // Klipp segmenten mot vy-gränserna
            const s = Math.max(minMs, Math.min(nowMs, seg.start));
            const e = Math.max(minMs, Math.min(nowMs, seg.end));

            if (s >= e) return;

            const p1 = ((s - minMs) / totalDuration) * 100;
            const p2 = ((e - minMs) / totalDuration) * 100;
            const color = seg.type === 'data' ? '#48c774' : '#ddd';

            gradientStops.push(`${color} ${p1.toFixed(2)}%`);
            gradientStops.push(`${color} ${p2.toFixed(2)}%`);
        });

        if (gradientStops.length === 0) {
             gradientBar.style.background = '#ddd';
        } else {
             gradientBar.style.background = `linear-gradient(to right, ${gradientStops.join(', ')})`;
        }
    }

    function findNearestDataPoint(targetTimeMs) {
        let nearest = null;
        let minDiff = Infinity;
        let index = -1;

        for (let i = 0; i < historyData.length; i++) {
            const time = new Date(historyData[i].timestamp).getTime();
            const diff = Math.abs(time - targetTimeMs);
            if (diff < minDiff) {
                minDiff = diff;
                nearest = historyData[i];
                index = i;
            }
        }
        return { point: nearest, index: index };
    }

    function updateHistoryFromSlider(timestampVal) {
        // Att dra slidern letar upp närmaste punkten
        const targetTime = parseInt(timestampVal);
        const { point } = findNearestDataPoint(targetTime);
        if (point) {
            updateHistoryUI_Render(point);
        }
    }

    window.snapHistorySlider = function(timestampVal) {
        const targetTime = parseInt(timestampVal);
        const { point } = findNearestDataPoint(targetTime);

        if (point) {
            const snapTime = new Date(point.timestamp).getTime();
            document.getElementById('history-slider').value = snapTime;
            updateHistoryUI_Render(point);
        }
    }

    function stepHistory(direction) {
        const slider = document.getElementById('history-slider');
        const currentVal = parseInt(slider.value);
        
        const { index } = findNearestDataPoint(currentVal);
        
        if (index === -1) return;

        // Hoppa till nästa/föregående index
        let newIndex = index + direction;
        
        if (newIndex < 0) newIndex = 0;
        if (newIndex >= historyData.length) newIndex = historyData.length - 1;
        
        const newPoint = historyData[newIndex];
        const newTime = new Date(newPoint.timestamp).getTime();
        
        // Flytta slidern och kartan
        slider.value = newTime;
        updateHistoryUI_Render(newPoint);
    }

    function updateHistoryUI_Render(point) {
        const dateStr = new Date(point.timestamp).toLocaleString('sv-SE');
        document.getElementById('history-time-label').innerText = dateStr;

        const newLatLng = [point.latitude, point.longitude];
        historyMarker.setLatLng(newLatLng);

        if (point.course !== undefined) {
            historyMarker.setRotationAngle(point.course);
        }

        document.getElementById('history-speed').innerText = point.speed ? Number(point.speed).toFixed(1) + " kn" : "-";
        document.getElementById('history-course').innerText = point.course ? Math.round(point.course) + "°" : "-";

        //Ta bort gammal vektor om den finns
        if (historyVector) {
            historyLayerGroup.removeLayer(historyVector);
            historyVector = null;
        }

        const speed = parseFloat(point.speed);
        const course = parseFloat(point.course);

        //Skapa ny vektor om fart finns och är > 0.2 knop
        if (!isNaN(speed) && !isNaN(course) && speed > 0.2) {
             const distance = speed * 100; // Samma skala som live-vyn

             const startPoint = L.latLng(point.latitude, point.longitude);
             const endPoint = L.GeometryUtil.destination(startPoint, course, distance);

             const start = [point.latitude, point.longitude];
             const end = [endPoint.lat, endPoint.lng];

             historyVector = L.layerGroup();

             // Svart outline (för synlighet)
             historyVector.addLayer(L.polyline([start, end], {
                 color: 'black',
                 weight: 7,
                 opacity: 1
             }));

             // Rosa linje
             historyVector.addLayer(L.polyline([start, end], {
                 color: '#D70077',
                 weight: 3,
                 opacity: 1
             }));

             // Cirkel i änden
             historyVector.addLayer(L.circleMarker(end, {
                 radius: 5,
                 color: 'black',
                 weight: 2,
                 fillColor: '#D70077',
                 fillOpacity: 1
             }));
             
             historyVector.addTo(historyLayerGroup);
        }
    }

    function updateHistoryUI(timeMs) {
        const { point } = findNearestDataPoint(timeMs);
        if(point) updateHistoryUI_Render(point);
    }

    function getSegmentEndIndex(fromIndex) {
        for (let i = fromIndex; i < historyData.length - 1; i++) {
            const t1 = new Date(historyData[i].timestamp).getTime();
            const t2 = new Date(historyData[i + 1].timestamp).getTime();
            if (t2 - t1 > GAP_THRESHOLD) return i;
        }
        return historyData.length - 1;
    }

    function togglePlayback() {
        if (isPlaying) stopPlayback(); else startPlayback();
    }

    function startPlayback() {
        const slider = document.getElementById('history-slider');
        const { index } = findNearestDataPoint(parseInt(slider.value));
        if (index === -1) return;
        const segmentEnd = getSegmentEndIndex(index);
        if (index >= segmentEnd) return;

        isPlaying = true;
        updatePlayButton();

        const intervalMs = PLAYBACK_SPEEDS[playbackSpeedIndex] * 1000;
        playbackInterval = setInterval(() => {
            const { index: curIdx } = findNearestDataPoint(parseInt(document.getElementById('history-slider').value));
            if (curIdx >= getSegmentEndIndex(curIdx)) {
                stopPlayback();
                return;
            }
            stepHistory(1);
        }, intervalMs);
    }

    function stopPlayback() {
        if (playbackInterval) {
            clearInterval(playbackInterval);
            playbackInterval = null;
        }
        isPlaying = false;
        updatePlayButton();
    }

    function updatePlayButton() {
        const btn = document.getElementById('play-button');
        const icon = document.getElementById('play-icon');
        if (!btn || !icon) return;
        if (isPlaying) {
            icon.className = 'fa-solid fa-pause';
            btn.classList.replace('is-primary', 'is-warning');
        } else {
            icon.className = 'fa-solid fa-play';
            btn.classList.replace('is-warning', 'is-primary');
        }
    }

    function renderSpeedButtons() {
        const container = document.getElementById('speed-buttons');
        if (!container) return;
        container.innerHTML = '';
        PLAYBACK_SPEEDS.forEach((speed, i) => {
            const tag = document.createElement('span');
            tag.className = `tag is-clickable ${i === playbackSpeedIndex ? 'is-primary' : 'is-light'}`;
            tag.textContent = speed + 's';
            tag.onclick = () => setPlaybackSpeed(i);
            container.appendChild(tag);
        });
    }

    function setPlaybackSpeed(index) {
        playbackSpeedIndex = index;
        renderSpeedButtons();
        if (isPlaying) {
            stopPlayback();
            startPlayback();
        }
    }

    function exitHistoryMode() {
        stopPlayback();
        isHistoryMode = false;
        historyData = [];

        document.getElementById('history-controls').style.display = 'none';

        historyLayerGroup.clearLayers();
        historyLayerGroup.removeFrom(lfmap);
        
        redrawAllMarkers();
    }

    function updateShipTable() {
        const shipTableBody = document.getElementById("shipTableBody");
        shipTableBody.innerHTML = "";

        const allShips = Object.keys(shipMarkers).sort((a, b) => a.localeCompare(b, "sv-se"));

        const movingShips = [];
        const fixedPoints = [];

        allShips.forEach(shipName => {
            const message = shipLastUpdate[shipName] || {};

            const isConsideredFixed = isFixed(shipName, message);

            if(isConsideredFixed){
                fixedPoints.push(shipName);
            } else {
                movingShips.push(shipName);
            }
        });

        movingShips.forEach(shipName => {
            const message = shipLastUpdate[shipName] || {};
            const row = createTableRow(shipName, message);
            shipTableBody.appendChild(row);
        });

        if (showStationary && fixedPoints.length > 0) {
            const headerRow = document.createElement("tr");
            headerRow.innerHTML = `
                <th colspan="5" style="text-align: center; background-color: #f5f5f5;">Fasta punkter</th>
            `;
            shipTableBody.appendChild(headerRow);

            fixedPoints.forEach(shipName => {
                const message = shipLastUpdate[shipName] || {};
                const row = createTableRow(shipName, message);
                shipTableBody.appendChild(row);
            });
        }
    }

    function createTableRow(shipName, message) {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${formatName(shipName)}</td>
            <td>${renderSpeed(message)}</td>
            <td>${renderCourse(message)}</td>
            <td>${renderTime(message)}</td>
            <td>
                <button class="button is-small" onclick="focusShip('${shipName}')">
                    <i class="fa-solid fa-crosshairs"></i>
                </button>
            </td>
        `;
        return row;
    }

    function isFixed(shipName, message) {
        const isRefPoint = shipName.toUpperCase().includes("REF POINT");
        const isStationary = (!message.speed || message.speed === 0)
                && message.legend == "Unspecified" && message.navigationalStatus == "Not defined (default)";
        const isRock = shipName.toUpperCase().includes("GRUND")
        const isVartan = shipName.toUpperCase().includes("VARTAN")
        return isStationary || isRefPoint || isRock || isVartan;
    }

    function focusShip(shipName) {
        const marker = shipMarkers[shipName];
        if (marker) {
            lfmap.setView(marker.getLatLng(), lfmap.getZoom(), { animate: true });
            burger = document.getElementsByClassName("navbar-burger")[0];
            burger.click();
        }
    }

    function renderSpeed(message) {
        if (message.speed) {
            return (message.speed.toFixed(1) > 0.2 ? message.speed.toFixed(1) : 0) + " knop";
        } else {
            return "-";
        }
    }

    function renderCourse(message) {
        if (message.speed) {
            return message.speed.toFixed(1) > 0.2 ? message.course + "&deg;" : "-";
        } else {
            return "-";
        }
    }

    function renderTime(message) {
        if (message.lastSeen) {
            let diff = new Date() - new Date(message.lastSeen);

            let ss = Math.floor(diff / 1000) % 60;
            let mm = Math.floor(diff / 1000 / 60) % 60;
            let hh = Math.floor(diff / 1000 / 60 / 60);

            let text = "";
            if (hh > 0) {
                text += `${hh}h`
            }
            if (mm > 0) {
                text += `${mm}m `
            }
            if (ss > 0) {
                text += `${ss}s`
            } else {
                text += `0s`
            }
            return text;
        } else {
            return "-";
        }
    }

</script>
