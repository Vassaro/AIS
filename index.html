<!DOCTYPE html>
<html lang="en">

<head>
    <title>Vässarö AIS</title>
    <link rel="icon" type="image/x-icon" href="img/vassaro_kvadrat.jpeg">
    <meta charset="utf-8" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-rotatedmarker@0.2.0/leaflet.rotatedMarker.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-geometryutil@0.10.1/src/leaflet.geometryutil.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="src/leaflet.nauticalscale.js"></script>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="css/navbar.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>

<body>
    <nav class="navbar is-fixed-top" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item has-text-weight-semibold" href="./">
                <img src="img/vassaro_logga.jpg">&nbsp;Vässarö AIS
                <!-- <i class="fa-solid fa-anchor"></i>&nbsp;Vässarö AIS -->
            </a>
            <span id="connectionStatus" class="navbar-item is-size-7 has-text-grey" data-state="connecting">
                <span class="conn-dot"></span><span id="connectionLabel">Ansluter…</span>
            </span>
            <button id="panelToggle" class="panel-toggle" aria-controls="controlPanel" aria-expanded="false" aria-label="Fartyg och inställningar">
                <i class="fa-solid fa-sliders"></i>
            </button>
        </div>
    </nav>

    <aside id="controlPanel" class="control-panel">
        <header id="panelHeader" class="panel-header">
            <button class="sheet-grabber" aria-label="Visa eller dölj fartygslistan"></button>
            <h2 class="is-size-5 has-text-weight-semibold">Fartyg <span id="shipCount" class="ship-count is-size-7 has-text-grey">0</span></h2>
        </header>

        <div class="panel-body">
            <div class="panel-section">
                <label class="panel-row">Visa alla fartyg
                    <span class="custom-switch"><input type="checkbox" id="showAllShipsSwitch"><span class="custom-slider"></span></span>
                </label>
                <label class="panel-row">Visa offline Vässaröfartyg
                    <span class="custom-switch"><input type="checkbox" id="showOfflineBoatsSwitch" checked><span class="custom-slider"></span></span>
                </label>
                <label class="panel-row">Visa fasta punkter
                    <span class="custom-switch"><input type="checkbox" id="showStationarySwitch"><span class="custom-slider"></span></span>
                </label>
                <label class="panel-row">Visa väder
                    <span class="custom-switch"><input type="checkbox" id="showWeatherSwitch"><span class="custom-slider"></span></span>
                </label>
            </div>

            <div class="panel-section">
                <table class="table is-fullwidth is-hoverable is-size-7">
                    <thead>
                        <tr>
                            <th>Namn</th>
                            <th class="has-text-right">Fart</th>
                            <th class="has-text-right">Kurs</th>
                            <th class="has-text-right" colspan="2">Senast sedd</th>
                        </tr>
                    </thead>
                    <tbody id="shipTableBody"></tbody>
                </table>
            </div>

            <div class="panel-section">
                <label class="panel-row desktop-only">Dölj meny automatiskt
                    <span class="custom-switch"><input type="checkbox" id="autoHideNavbarSwitch" checked><span class="custom-slider"></span></span>
                </label>
                <label class="panel-row">Uppdatera automatiskt
                    <span class="select is-small">
                        <select id="autoRefreshSelect">
                            <option value="0">Av</option>
                            <option value="60000">1 min</option>
                            <option value="300000">5 min</option>
                            <option value="900000">15 min</option>
                            <option value="1800000">30 min</option>
                            <option value="3600000">1 tim</option>
                        </select>
                    </span>
                </label>
                <label class="panel-row">Storlek på båtnamn
                    <span class="select is-small">
                        <select id="labelSizeSelect">
                            <option value="12px">Liten</option>
                            <option value="15px">Mellan</option>
                            <option value="18px">Stor</option>
                        </select>
                    </span>
                </label>
                <div class="panel-row">
                    <button class="button is-small is-fullwidth" onclick="openMultiTrailPicker()">
                        <span class="icon"><i class="fa-solid fa-route"></i></span>
                        <span>Flera spår</span>
                    </button>
                </div>
                <div class="panel-row">
                    <button id="resetZoomButton" class="button is-small is-fullwidth">
                        <span class="icon"><i class="fa-solid fa-magnifying-glass-minus"></i></span>
                        <span>Återställ zoom</span>
                    </button>
                </div>
            </div>

            <p class="has-text-centered is-size-7 has-text-grey mt-4">
                Den här hemsidan bor på
                <a href="https://github.com/vassaro/AIS">Github <i class="fa-brands fa-github"></i></a>
            </p>
        </div>
    </aside>

    <div id="map"></div>

    <div id="history-duration-modal" class="modal">
        <div class="modal-background" onclick="closeDurationModal()"></div>
        <div class="modal-content">
            <div class="box has-text-centered">
                <h3 class="title is-5 mb-2">Välj tidsintervall</h3>
                <p class="mb-4">Hur lång historik vill du ladda för <strong id="modal-ship-name"></strong>?</p>
                <div class="buttons is-centered">
                    <button class="button is-link" onclick="startHistoryLoading('12h')">12h</button>
                    <button class="button is-link" onclick="startHistoryLoading('24h')">24h</button>
                    <button class="button is-link" onclick="startHistoryLoading('48h')">48h</button>
                </div>
                <div class="buttons is-centered">
                    <button class="button is-warning is-light" onclick="startHistoryLoading('exact')">Exakt data 48h (Kan ta längre tid)</button>
                </div>
            </div>
        </div>
        <button class="modal-close is-large" aria-label="close" onclick="closeDurationModal()"></button>
    </div>

    <div id="multi-trail-modal" class="modal">
        <div class="modal-background" onclick="closeMultiTrailPicker()"></div>
        <div class="modal-content">
            <div class="box trail-picker">
                <h3 class="title is-5 mb-1">Flera spår</h3>
                <p class="is-size-7 has-text-grey mb-3">Välj båtar att visa på samma tidslinje.</p>
                <div id="trail-picker-durations" class="buttons has-addons is-centered mb-3">
                    <button class="button is-small" data-duration="12h">12h</button>
                    <button class="button is-small" data-duration="24h">24h</button>
                    <button class="button is-small" data-duration="48h">48h</button>
                    <button class="button is-small" data-duration="exact">Exakt 48h</button>
                </div>
                <input id="trail-picker-search" class="input is-small mb-2" type="search" placeholder="Sök namn eller MMSI">
                <div id="trail-picker-list" class="trail-picker-list"></div>
                <div class="is-flex is-justify-content-space-between is-align-items-center mt-3">
                    <span id="trail-picker-count" class="is-size-7 has-text-grey"></span>
                    <div class="buttons mb-0">
                        <button class="button is-small is-light mb-0" onclick="clearTrailPicker()">Rensa</button>
                        <button id="trail-picker-confirm" class="button is-small is-link mb-0" onclick="confirmMultiTrail()">Visa spår</button>
                    </div>
                </div>
            </div>
        </div>
        <button class="modal-close is-large" aria-label="close" onclick="closeMultiTrailPicker()"></button>
    </div>

    <div id="history-controls" class="box" style="display: none;">
        <div id="history-card-header" class="history-card-header" title="Dra för att flytta, dubbelklicka för att återställa">
            <h3 class="title is-5 is-marginless" id="history-title">Historik</h3>
            <span id="history-mini-time" class="history-mini-only is-size-7 has-text-grey"></span>
            <div class="buttons mb-0">
                <button class="button is-small is-primary mb-0 history-mini-only" id="mini-play-button" onclick="togglePlayback()" aria-label="Spela upp">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button class="button is-small mb-0 history-full-only" onclick="stopPlayback(); openMultiTrailPicker()" aria-label="Lägg till båt">
                    <i class="fa-solid fa-plus"></i><span class="is-hidden-mobile">&nbsp;Lägg till båt</span>
                </button>
                <button class="button is-small mb-0" id="history-minimize-button" onclick="toggleHistoryCardMinimized()" aria-label="Förminska">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <button class="button is-small is-danger mb-0" onclick="exitHistoryMode()" aria-label="Stäng">
                    <i class="fa-solid fa-times"></i><span class="is-hidden-mobile">&nbsp;Stäng</span>
                </button>
            </div>
        </div>

        <div class="history-card-body">
        <div class="field">
            <div class="is-flex is-justify-content-space-between mb-1">
                <label class="label" id="history-time-label">Tidpunkt</label>
                <span class="tag is-light">Nu</span>
            </div>
            
            <div class="control" style="width: 100%; display: flex; align-items: center; gap: 10px;">
                <button class="button is-small" onclick="stopPlayback(); stepHistory(-1)">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <!-- Slider Container -->
                <div style="position: relative; flex-grow: 1; height: 24px; display: flex; align-items: center;">
                    <!-- background bar for data/gaps -->
                    <div id="slider-gradient" style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; background: #eee; width: 100%; top: 50%; transform: translateY(-50%);"></div>

                    <!-- Slider -->
                    <input
                        id="history-slider"
                        class="slider"
                        style="width: 100%; position: absolute; background: transparent; -webkit-appearance: none; appearance: none; margin: 0; cursor: pointer;"
                        step="1"
                        type="range"
                        oninput="stopPlayback(); updateHistoryFromSlider(this.value)"
                        onchange="snapHistorySlider(this.value)"
                    >
                </div>

                <button class="button is-small" onclick="stopPlayback(); stepHistory(1)">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button class="button is-small is-primary" id="play-button" onclick="togglePlayback()">
                    <i class="fa-solid fa-play" id="play-icon"></i>
                </button>
            </div>
            <div class="is-flex is-align-items-center is-justify-content-center mt-2" style="gap: 6px;">
                <span class="is-size-7 has-text-grey">Intervall:</span>
                <div id="speed-buttons" class="tags mb-0" style="gap: 4px;"></div>
            </div>
        </div>
        <div id="history-legend" class="history-legend"></div>
        </div>
    </div>

    <script src="js/settings.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/panel.js"></script>
    <script src="js/historyCard.js"></script>

</body>

<script>

    // LEAFLET MAP
    const BASEMAPS = {
        OpenStreetMap: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors.'
        }),
        // OSM has no dark tiles; OpenFreeMap's dark style uses the same data, no key
        'Mörk': L.maplibreGL({
            style: 'https://tiles.openfreemap.org/styles/dark',
            attribution: '<a href="https://openfreemap.org">OpenFreeMap</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors.'
        }),
        Satellit: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; <a href="https://www.arcgis.com/home/item.html?id=10df2279f9684e4a9f6a7f08febac2a9">Esri, Maxar, Earthstar Geographics, and the GIS User Community</a>.'
        })
    };


    const SOUTH_WEST = L.latLng(55.3, 10.0);
    const NORTH_EAST = L.latLng(69.0, 24.5);
    const BOUNDS = L.latLngBounds(SOUTH_WEST, NORTH_EAST);

    // PERSISTED SETTINGS (localStorage, see js/settings.js)
    const savedSettings = loadSettings();

    // wires a settings switch: restores its saved state, then saves and reports every flip
    function bindSwitch(id, key, defaultValue, onChange) {
        const input = document.getElementById(id);
        input.checked = savedSettings[key] ?? defaultValue;
        input.addEventListener('change', () => {
            saveSettings({ [key]: input.checked });
            onChange(input.checked);
        });
        return input.checked;
    }

    // map starts centered on Strömsviken - Djuphamn
    const DEFAULT_CENTER = [60.24521, 18.68388];
    const DEFAULT_ZOOM = 13;

    var lfmap = L.map('map', {
        center: savedSettings.center || DEFAULT_CENTER,
        zoom: savedSettings.zoom ?? DEFAULT_ZOOM,
        minZoom: 8,
        maxBounds: BOUNDS,
        maxBoundsViscosity: 1.0,
        zoomControl: false,
        layers: [BASEMAPS.OpenStreetMap]
    });

    lfmap.on('zoomend moveend', () => {
        const c = lfmap.getCenter();
        saveSettings({ zoom: lfmap.getZoom(), center: [c.lat, c.lng] });
    });

    document.getElementById('resetZoomButton').addEventListener('click', () => {
        lfmap.setView(DEFAULT_CENTER, DEFAULT_ZOOM);
    });

    L.control.layers(BASEMAPS, null, { position: 'bottomright' }).addTo(lfmap);

    const SCALE = new L.control.scaleNautical({
        maxWidth: 300,
        nauticalMilesUnit: "sjömil"
    }).addTo(lfmap);


    let showAllShips = bindSwitch('showAllShipsSwitch', 'showAllShips', false, on => { showAllShips = on; redrawAllMarkers(); });
    let showStationary = bindSwitch('showStationarySwitch', 'showStationary', false, on => { showStationary = on; redrawAllMarkers(); });
    let showOfflineBoats = bindSwitch('showOfflineBoatsSwitch', 'showOfflineBoats', true, on => { showOfflineBoats = on; redrawAllMarkers(); });
    const offlineBoats = new Set();

    window.setNavbarAutoHideEnabled(bindSwitch('autoHideNavbarSwitch', 'autoHideNavbar', true, window.setNavbarAutoHideEnabled));

    let autoRefreshInterval = null;
    const autoRefreshSelect = document.getElementById('autoRefreshSelect');

    function applyAutoRefresh(ms) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = ms > 0 ? setInterval(() => location.reload(), ms) : null;
    }

    const savedAutoRefreshMs = savedSettings.autoRefreshMs ?? 0;
    autoRefreshSelect.value = String(savedAutoRefreshMs);
    applyAutoRefresh(savedAutoRefreshMs);

    autoRefreshSelect.addEventListener('change', function (event) {
        const ms = Number(event.target.value);
        saveSettings({ autoRefreshMs: ms });
        applyAutoRefresh(ms);
    });

    const labelSizeSelect = document.getElementById('labelSizeSelect');
    labelSizeSelect.value = savedSettings.labelSize ?? '15px';
    document.documentElement.style.setProperty('--label-size', labelSizeSelect.value);

    labelSizeSelect.addEventListener('change', function (event) {
        saveSettings({ labelSize: event.target.value });
        document.documentElement.style.setProperty('--label-size', event.target.value);
        scheduleLabelDeclutter(); // bigger names need more room
    });

    lfmap.on('baselayerchange', function (e) {
       // marker halos flip from white to dark on the dark basemap, see style.css
       document.documentElement.classList.toggle('dark-basemap', e.name === 'Mörk');
       const isSatellite = e.name === 'Satellit';
       document.documentElement.style.setProperty('--accent-color', isSatellite ? '#e1e1e1' : '#003660');
       // only uncolored (single boat) trails follow the basemap
       historyTracks.forEach(track => {
           if (!track.color && track.path) track.path.setStyle({ color: defaultTrailColor(isSatellite) });
       });
    });

    function redrawAllMarkers() {
        // clear existing markers and vectors
        Object.values(shipMarkers).forEach(marker => lfmap.removeLayer(marker));
        Object.values(shipVectors).forEach(vector => lfmap.removeLayer(vector));
        shipMarkers = {};
        shipVectors = {};
        // re-add markers with the new filter
        Object.values(shipLastUpdate).forEach(message => {
            createMarker(message);
        });
    }

    // WEB SOCKET
    const WS_URL = "wss://ais.vassaro.net/";
    const MAX_RETRIES = 3;
    let ws;
    let retries = 0;
    let retryTimer;

    var shipLastUpdate = {};

    // API sends MMSI as float ("265575840.0"), WS as int
    const normalizeMmsi = mmsi => String(Math.round(parseFloat(mmsi)) || 0);

    function resolveShipName(entity) {
        const rawName = entity.name && entity.name.trim();
        if (rawName) return rawName;
        return MMSI_NAME_MAP[normalizeMmsi(entity.mmsi)] || null;
    }

    async function fetchLatestAndAddOfflineBoats() {
        try {
            const response = await fetch('https://ais.vassaro.net/api/data/latest');
            if (!response.ok) return;
            const vessels = await response.json();

            vessels.forEach(vessel => {
                const shipName = resolveShipName(vessel);
                if (!shipName) return;
                if (shipLastUpdate[shipName]) return;
                if (vessel.latitude == null || vessel.longitude == null) return;

                let ts = vessel.timestamp;
                if (ts && typeof ts === 'string' && !ts.endsWith('Z') && !ts.includes('+')) ts += 'Z';

                const message = {
                    name: shipName,
                    mmsi: vessel.mmsi,
                    coordinates: [vessel.latitude, vessel.longitude],
                    speed: vessel.speed || 0,
                    course: vessel.course || 0,
                    lastSeen: ts ? new Date(ts) : null
                };
                offlineBoats.add(shipName);
                shipLastUpdate[shipName] = message;
                createMarker(message);
            });
        } catch (e) {
            console.error('Failed to fetch latest positions:', e);
        }
    }

    function handleMessage(event) {
        // Engine.IO ping → pong, otherwise server drops connection
        if (event.data === '2') return ws.send('3');
        if (!event.data.startsWith('42')) return;
        if (event.data.startsWith('42["vesselPositions-init"')) {
            const vessels = JSON.parse(event.data.toString().slice(2))[1];
            vessels.forEach(message => {
                const shipName = resolveShipName(message);
                if (!shipName) return;
                message.name = shipName;
                if (!shipLastUpdate[shipName]) {
                    message.lastSeen = new Date();
                    createMarker(message);
                    shipLastUpdate[shipName] = message;
                }
            });
            fetchLatestAndAddOfflineBoats();
        } else {
            const message = JSON.parse(event.data.toString().slice(2))[1];
            const shipName = resolveShipName(message);
            if (shipName) {
                message.name = shipName;
                message.lastSeen = new Date();
                shipLastUpdate[shipName] = message;
            }
            createMarker(message);
        }
    }

    const CONNECTION_LABELS = { live: "Live", offline: "Frånkopplad" };

    function setConnectionStatus(state) {
        document.getElementById('connectionStatus').dataset.state = state;
        document.getElementById('connectionLabel').textContent = CONNECTION_LABELS[state];
    }

    function connect() {
        ws = new WebSocket(WS_URL);
        ws.onmessage = handleMessage;
        ws.onopen = () => {
            retries = 0;
            setConnectionStatus('live');
        };
        ws.onclose = (event) => {
            console.log("Connection closed", event.code, event.reason, event.wasClean)
            setConnectionStatus('offline');
            if (retries < MAX_RETRIES) {
                retryTimer = setTimeout(connect, 1000 * 2 ** retries++);
            } else {
                alert("Vi får ingen kontakt med Vässarö...");
            }
        };
        // onclose fires after onerror, retry handled there
        ws.onerror = () => console.log("Connection error");
    }

    function reconnectIfDead() {
        if (ws.readyState !== WebSocket.CLOSED) return;
        clearTimeout(retryTimer);
        retries = 0;
        connect();
    }

    window.addEventListener('online', reconnectIfDead);
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) reconnectIfDead();
    });

    connect();


    const BOAT_COLORS = {
        vassaro: '#0033ff',
        rescue: '#f10010',
        default: '#ff27ac'
    };

    const arrowIconVassaro = L.icon({
        iconUrl: 'img/Boat marker blue.svg',
        iconSize: [42, 42],
        iconAnchor: [21, 21], // center of icon
    });

    const arrowIconRescue = L.icon({
        iconUrl: 'img/Boat marker red.svg',
        iconSize: [42, 42],
        iconAnchor: [21, 21], // center of icon
    });

    const arrowIconDefault = L.icon({
        iconUrl: 'img/Boat marker pink.svg',
        iconSize: [42, 42],
        iconAnchor: [21, 21], // center of icon
    });

    function getShipCategory(shipName) {
        const upper = shipName.toUpperCase();
        if (upper.includes("RESCUE")) return "rescue";
        if (upper.includes("VASSARO") || VASSARO_SHIP_NAMES.has(upper)) return "vassaro";
        return "default";
    }

    function getShipIcon(shipName) {
        const category = getShipCategory(shipName);
        if (category === "rescue") return arrowIconRescue;
        if (category === "vassaro") return arrowIconVassaro;
        return arrowIconDefault;
    }

    function getShipColor(shipName) {
        return BOAT_COLORS[getShipCategory(shipName)];
    }

    // black outline underneath, colored line + end circle on top, matches boat icon
    function createVectorLayer(start, end, color) {
        const group = L.layerGroup();
        group.addLayer(L.polyline([start, end], { color: 'black', weight: 7, opacity: 1 }));
        group.addLayer(L.polyline([start, end], { color: color, weight: 3, opacity: 1 }));
        group.addLayer(L.circleMarker(end, { radius: 5, color: 'black', weight: 2, fillColor: color, fillOpacity: 1 }));
        return group;
    }

    const stationaryIcon = L.icon({
        iconUrl: 'img/stationary.svg',
        iconSize: [42, 42],
        iconAnchor: [21, 42], // bottom of icon
    });

    const locationIcon = L.divIcon({
        html: '<i style="color: var(--harbor-color)" class="fa-solid fa-location-crosshairs fa-2x"></i>',
        iconSize: [42, 42],
        iconAnchor: [21, 21], // center of icon
        className: "locationIcon"
    });

    // WEATHER (ViVa)
    const VIVA_API_URL = "https://services.viva.sjofartsverket.se:8080/output/vivaoutputservice.svc/vivastation";
    const WIND_HEADING_PLACEHOLDER = 0; // int placeholder rotation until a station's real wind is fetched
    const WIND_CACHE_TTL_MS = 60 * 1000; // matches the API's own cache-control: max-age=60

    const windIcon = L.divIcon({
        html: '<i style="color: var(--weather-color)" class="fa-solid fa-arrow-up fa-2x"></i>',
        iconSize: [42, 42],
        iconAnchor: [21, 21], // center of icon
        className: "windIcon"
    });

    const weatherDotIcon = L.divIcon({
        html: '<i style="color: var(--weather-color)" class="fa-solid fa-circle"></i>',
        iconSize: [14, 14],
        iconAnchor: [7, 7], // center of icon
        className: "weatherDotIcon"
    });

    let showWeather = false;           // set by the weather switch below
    let weatherStations = null;        // cached full station list, fetched once
    let weatherStationsLoading = null; // in-flight promise guard
    const weatherMarkers = {};         // keyed by station ID
    const weatherWindCache = {};       // stationID -> { wind, fetchedAt }; wind is null if station has none
    const weatherLayerGroup = L.layerGroup();
    let weatherRefreshInterval = null;

    // cap how many weather requests can run at once
    const ARROW_FETCH_CONCURRENCY = 6;
    let activeArrowFetches = 0;
    const arrowFetchQueue = [];

    function enqueueArrowFetch(task) {
        arrowFetchQueue.push(task);
        processArrowFetchQueue();
    }

    function processArrowFetchQueue() {
        while (activeArrowFetches < ARROW_FETCH_CONCURRENCY && arrowFetchQueue.length > 0) {
            const task = arrowFetchQueue.shift();
            activeArrowFetches++;
            task().finally(() => {
                activeArrowFetches--;
                processArrowFetchQueue();
            });
        }
    }

    async function ensureWeatherStationsLoaded() {
        if (weatherStations) return weatherStations;
        if (!weatherStationsLoading) {
            weatherStationsLoading = fetch(VIVA_API_URL)
                .then(r => r.json())
                .then(data => weatherStations = data.GetStationsResult.Stations);
        }
        return weatherStationsLoading;
    }

    function applyWindToMarker(marker, wind) {
        if (wind) {
            marker.setIcon(windIcon);
            // ViVa's Heading is the meteorological direction the wind blows FROM;
            // flip 180° so the arrow points the way the wind is blowing TO.
            const heading = wind.Heading || WIND_HEADING_PLACEHOLDER;
            marker.setRotationAngle((heading + 180) % 360);
        } else {
            marker.setIcon(weatherDotIcon);
        }
    }

    function isWindCacheFresh(stationId) {
        const cached = weatherWindCache[stationId];
        return !!cached && (Date.now() - cached.fetchedAt) < WIND_CACHE_TTL_MS;
    }

    function updateWeatherMarkers() {
        if (!showWeather || !weatherStations) return;
        const bounds = lfmap.getBounds();
        const inView = new Set();

        weatherStations.forEach(station => {
            const latlng = [station.Lat, station.Lon];
            if (!bounds.contains(latlng)) return;
            inView.add(station.ID);
            if (weatherMarkers[station.ID]) return;

            const marker = L.marker(latlng, {
                icon: windIcon,
                rotationAngle: WIND_HEADING_PLACEHOLDER
            });
            marker.bindPopup(`Laddar ${station.Name}...`, { className: "shipPopup" });
            marker.on('popupopen', () => loadStationDetail(station, marker));
            marker._station = station; // used to refresh visible markers periodically
            marker.addTo(weatherLayerGroup);
            weatherMarkers[station.ID] = marker;

            // station is in view - grab wind (from cache if still fresh) to draw the arrow
            if (isWindCacheFresh(station.ID)) {
                applyWindToMarker(marker, weatherWindCache[station.ID].wind);
            } else {
                enqueueArrowFetch(() => loadStationArrow(station, marker));
            }
        });

        // drop markers that fell out of view (data stays cached)
        Object.keys(weatherMarkers).forEach(id => {
            if (!inView.has(Number(id))) {
                weatherLayerGroup.removeLayer(weatherMarkers[id]);
                delete weatherMarkers[id];
            }
        });
    }

    async function fetchStationSamples(station) {
        const response = await fetch(`${VIVA_API_URL}/${station.ID}`);
        if (!response.ok) throw new Error("Kunde inte hämta väder");
        const data = await response.json();
        const samples = data.GetSingleStationResult.Samples || [];
        const wind = samples.find(s => s.Type === 'wind' && s.Name === 'Medelvind')
                  || samples.find(s => s.Type === 'wind')
                  || null;
        return { samples, wind };
    }

    async function loadStationArrow(station, marker) {
        try {
            const { wind } = await fetchStationSamples(station);
            weatherWindCache[station.ID] = { wind, fetchedAt: Date.now() };
            applyWindToMarker(marker, wind);
        } catch (e) {
            // arrow just keeps its last direction, nothing cached - retried next time station is visible
        }
    }

    async function loadStationDetail(station, marker) {
        try {
            const { samples, wind } = await fetchStationSamples(station);

            weatherWindCache[station.ID] = { wind, fetchedAt: Date.now() };
            applyWindToMarker(marker, wind);

            if (samples.length === 0) {
                marker.setPopupContent(`${station.Name}: ingen data tillgänglig`);
                return;
            }

            const rows = samples.map(s => `<tr><td>${s.Name}:</td><td>${s.Value} ${s.Unit}</td></tr>`).join('');
            marker.setPopupContent(`
                <table>
                    <thead><tr><td colspan="2" style="font-weight:bold;">${station.Name}</td></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            `);
        } catch (e) {
            marker.setPopupContent(`${station.Name}: kunde inte hämta väder`);
        }
    }

            } else {

            // CREATE PREDICTING VECTOR

                const bearing = message.course;

                // project the endpoint (distance in meters)
                const endPoint = L.GeometryUtil.destination(startPoint, bearing, distance);

                const start = [startPoint.lat, startPoint.lng];

    // LABEL COLLISIONS: nudge overlapping ship names up/down, hide the ones with no room.
    // Vässarö + rescue boats go first so their names always win.
    const LABEL_NUDGES = [0, -1, 1, -2, 2]; // in label heights
    let labelUpdateQueued = false;

    function scheduleLabelDeclutter() {
        if (labelUpdateQueued) return;
        labelUpdateQueued = true;
        requestAnimationFrame(() => {
            labelUpdateQueued = false;
            declutterLabels();
        });
    }

    function declutterLabels() {
        const isPriority = name => getShipCategory(name) !== "default";
        const names = Object.keys(shipMarkers).sort((a, b) => isPriority(b) - isPriority(a));
        const placed = [];

        names.forEach(name => {
            const el = shipMarkers[name].getTooltip()?.getElement();
            if (!el) return;
            const rect = el.getBoundingClientRect();
            const top = rect.top - (Number(el.dataset.nudge) || 0); // position without current nudge

            const nudge = LABEL_NUDGES.map(n => n * (rect.height + 2)).find(dy => {
                const box = { left: rect.left, right: rect.right, top: top + dy, bottom: top + dy + rect.height };
                const free = !placed.some(p => box.left < p.right && box.right > p.left && box.top < p.bottom && box.bottom > p.top);
                if (free) placed.push(box);
                return free;
            });

            el.classList.toggle('label-hidden', nudge === undefined);
            el.dataset.nudge = nudge ?? 0;
            el.style.marginTop = `${nudge ?? 0}px`;
        });
    }

    const TRAIL_COLORS = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#9a6324', '#ffe119'];

    let historyTracks = [];   // { mmsi, name, color, data, segments, marker, path, vector, legendRow }, color only in multi trail
    let historyTimeline = []; // sorted unique timestamps (ms) of all tracks, what the slider steps through
    let historyLayerGroup = L.layerGroup();

    const GAP_THRESHOLD = 30 * 60 * 1000; // 30 minuter

    function getHistoryCutoffTime() {
        return Date.now() - (historyDurationHours * 60 * 60 * 1000);
    }

    const durationToHours = durationStr => durationStr === 'exact' ? 48 : parseInt(durationStr.replace('h', ''));

    const pointTime = p => new Date(p.timestamp).getTime();

    const defaultTrailColor = isSatellite => isSatellite ? 'rgba(255, 255, 255, 0.4)' : 'rgba(0, 110, 0, 0.4)';

    // splits into { start, end } index ranges wherever two points are more than GAP_THRESHOLD apart
    function splitAtGaps(data) {
        const segments = [];
        let start = 0;
        for (let i = 1; i <= data.length; i++) {
            if (i === data.length || pointTime(data[i]) - pointTime(data[i - 1]) > GAP_THRESHOLD) {
                segments.push({ start, end: i - 1 });
                start = i;
            }
        }
        return segments;
    }

    function promptHistoryDuration(mmsi, shipName) {

    async function fetchTrackData(mmsi, durationStr) {
        const url = durationStr === 'exact'
            ? `https://ais.vassaro.net/api/data/${mmsi}`
            : `https://ais.vassaro.net/api/data/${durationStr}/${mmsi}`;

        const response = await fetch(url);
        if (!response.ok) throw new Error("Kunde inte hämta data");

        const data = await response.json();
        return data.map(p => {
            let ts = p.timestamp || p.minute;
            if (ts && typeof ts === 'string' && !ts.endsWith('Z') && !ts.includes('+')) {
                ts += 'Z';
            }
            return { ...p, timestamp: ts };
        }).filter(p => p.latitude != null && p.longitude != null);
    }

    // boats: [{ mmsi, name, color? }], one boat without color = classic single history
    async function loadHistoryTracks(boats, durationStr) {
        const loadId = ++historyLoadId;
        stopPlayback();
        historyDurationStr = durationStr;
        historyDurationHours = durationToHours(durationStr);

        historyTracks = [];
        historyTimeline = [];
        historyLayerGroup.clearLayers();
        document.getElementById('history-legend').innerHTML = '';

        if (!isHistoryMode) {
            isHistoryMode = true;
            document.body.classList.add('history-active');
            redrawAllMarkers();
        }

        document.getElementById('history-title').innerText = boats.length === 1
            ? `Laddar historik för ${formatName(boats[0].name)}...`
            : `Laddar historik för ${boats.length} båtar...`;
        document.getElementById('history-controls').style.display = 'block';
        window.placeHistoryCard();

        const results = await Promise.allSettled(boats.map(boat => fetchTrackData(normalizeMmsi(boat.mmsi), durationStr)));
        if (loadId !== historyLoadId) return; // closed or replaced while loading

        results.forEach(r => { if (r.status === 'rejected') console.error(r.reason); });

        // boats without data are dropped, the rest keep the color they were picked with
        historyTracks = boats
            .map((boat, i) => ({
                mmsi: normalizeMmsi(boat.mmsi),
                name: boat.name,
                color: boat.color || null,
                data: results[i].status === 'fulfilled' ? results[i].value : []
            }))
            .filter(track => track.data.length > 0)
            .map(track => ({ ...track, segments: splitAtGaps(track.data), vector: null }));

        if (historyTracks.length === 0) {
            alert("Ingen historik hittades.");
            exitHistoryMode();
            return;
        }

        historyTimeline = [...new Set(historyTracks.flatMap(track => track.data.map(pointTime)))].sort((a, b) => a - b);
        initializeHistoryMap();
    }

    function initializeHistoryMap() {
        historyLayerGroup.addTo(lfmap);
        document.getElementById('history-title').innerText = historyTracks.length === 1
            ? formatName(historyTracks[0].name)
            : `${historyTracks.length} båtar`;

        const cutoffTime = getHistoryCutoffTime();
        const isSatellite = lfmap.hasLayer(BASEMAPS.Satellit);
        const bounds = L.latLngBounds([]);

        historyTracks.forEach(track => {
            // one line per stretch without gaps, points older than the cutoff dropped
            const segments = track.segments
                .map(seg => track.data.slice(seg.start, seg.end + 1)
                    .filter(p => pointTime(p) >= cutoffTime)
                    .map(p => [p.latitude, p.longitude]))
                .filter(seg => seg.length > 0);

            track.path = L.polyline(segments, {
                color: track.color || defaultTrailColor(isSatellite),
                opacity: track.color ? 0.7 : 1,
                weight: 3,
                dashArray: '5, 10'
            }).addTo(historyLayerGroup);
            if (segments.length > 0) bounds.extend(track.path.getBounds());

            // added to the map in updateHistoryUI_Render, only while the boat has data at the slider time
            const last = track.data[track.data.length - 1];
            track.marker = L.marker([last.latitude, last.longitude], {
                icon: getShipIcon(track.name),
                zIndexOffset: 1000
            });
            if (historyTracks.length > 1) {
                track.marker.bindTooltip(formatName(track.name), { offset: [20, 0], permanent: true });
            }
        });

        if (bounds.isValid()) lfmap.fitBounds(bounds, { padding: [50, 50] });

        renderHistoryLegend();
        updateSliderRange();
        renderSpeedButtons();

        const startTime = historyTimeline[historyTimeline.length - 1];
        document.getElementById('history-slider').value = startTime;
        updateHistoryUI_Render(startTime);
    }

    function renderHistoryLegend() {
        const legend = document.getElementById('history-legend');
        legend.innerHTML = '';
        historyTracks.forEach(track => {
            const row = document.createElement('div');
            row.className = 'history-legend-row';
            row.innerHTML = `
                <span class="trail-dot" style="background: ${track.color || getShipColor(track.name)}"></span>
                <span class="history-legend-name"></span>
                <span class="tag is-primary is-light" data-field="speed">-</span>
                <span class="tag is-info is-light" data-field="course">-</span>
            `;

            row.addEventListener('click', () => {

            });
            track.legendRow = row;
            legend.appendChild(row);
        });

    // every boat's stretches as [startMs, endMs], overlaps merged and sorted, these are the green intervals on the slider
    function getDataRanges() {
        const ranges = historyTracks
            .flatMap(track => track.segments.map(seg => [pointTime(track.data[seg.start]), pointTime(track.data[seg.end])]))
            .filter(([s, e]) => s < e) // single point
            .sort((a, b) => a[0] - b[0]);

        const merged = [];
        ranges.forEach(([s, e]) => {
            const prev = merged[merged.length - 1];
            if (prev && s <= prev[1]) prev[1] = Math.max(prev[1], e);
            else merged.push([s, e]);
        });
        return merged;
    }

    function updateSliderRange() {
        // recompute the visible time window
        const nowMs = new Date().getTime();
        const minMs = nowMs - (historyDurationHours * 60 * 60 * 1000);

        const slider = document.getElementById('history-slider');
        const gradientBar = document.getElementById('slider-gradient');

        // keep track of the current value
        const currentValue = parseInt(slider.value);

        // update the slider bounds
        slider.min = minMs;
        slider.max = nowMs;

        if (currentValue < minMs) {
            slider.value = minMs;
            updateHistoryFromSlider(minMs);
        }

        if (historyTimeline.length < 2) {
            gradientBar.style.background = '#ddd';
            return;
        }

        // green intervals clipped to the visible range
        const merged = getDataRanges()
            .map(([s, e]) => [Math.max(minMs, Math.min(nowMs, s)), Math.max(minMs, Math.min(nowMs, e))])
            .filter(([s, e]) => s < e); // outside the window

        const totalDuration = nowMs - minMs;
        const gradientStops = [];

        // green where there is data, grey in between (the first and last stop colors fill the ends)
        merged.forEach(([s, e]) => {
            const p1 = (((s - minMs) / totalDuration) * 100).toFixed(2);
            const p2 = (((e - minMs) / totalDuration) * 100).toFixed(2);

            gradientStops.push(`#ddd ${p1}%`, `#48c774 ${p1}%`, `#48c774 ${p2}%`, `#ddd ${p2}%`);
        });

        if (gradientStops.length === 0) {
             gradientBar.style.background = '#ddd';
        } else {
             gradientBar.style.background = `linear-gradient(to right, ${gradientStops.join(', ')})`;
        }
    }

    // index of the timeline entry closest to targetTimeMs, -1 if the timeline is empty
    function findNearestTimelineIndex(targetTimeMs) {
        let lo = 0;
        let hi = historyTimeline.length - 1;
        if (hi < 0) return -1;
        while (lo < hi) {
            const mid = (lo + hi) >> 1;
            if (historyTimeline[mid] < targetTimeMs) lo = mid + 1; else hi = mid;
        }
        if (lo > 0 && targetTimeMs - historyTimeline[lo - 1] <= historyTimeline[lo] - targetTimeMs) return lo - 1;
        return lo;
    }

    // a boat's latest point at or before timeMs, null if it has no data that recent
    function trackPointAt(track, timeMs) {
        let lo = 0;
        let hi = track.data.length - 1;
        let found = -1;
        while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            if (pointTime(track.data[mid]) <= timeMs) {
                found = mid;
                lo = mid + 1;
            } else {
                hi = mid - 1;
            }
        }
        if (found === -1 || timeMs - pointTime(track.data[found]) > GAP_THRESHOLD) return null;
        return track.data[found];
    }

    function updateHistoryFromSlider(timestampVal) {
        // dragging the slider snaps to the nearest point
        const index = findNearestTimelineIndex(parseInt(timestampVal));
        if (index !== -1) {
            updateHistoryUI_Render(historyTimeline[index]);
        }
    }

    window.snapHistorySlider = function(timestampVal) {
        const index = findNearestTimelineIndex(parseInt(timestampVal));
        if (index !== -1) {
            const snapTime = historyTimeline[index];
            document.getElementById('history-slider').value = snapTime;
            updateHistoryUI_Render(snapTime);
        }
    }

    function stepHistory(direction) {
        const slider = document.getElementById('history-slider');
        const index = findNearestTimelineIndex(parseInt(slider.value));
        if (index === -1) return;

        // jump to the next/previous timestamp any boat has
        const newIndex = Math.max(0, Math.min(historyTimeline.length - 1, index + direction));
        const newTime = historyTimeline[newIndex];

        // move the slider to match
        slider.value = newTime;
        updateHistoryUI_Render(newTime);
    }

    function updateHistoryUI_Render(timeMs) {
        const dateStr = new Date(timeMs).toLocaleString('sv-SE');
        document.getElementById('history-time-label').innerText = dateStr;
        document.getElementById('history-mini-time').innerText = dateStr;

        historyTracks.forEach(track => {
            const point = trackPointAt(track, timeMs);

            const row = track.legendRow;
            row.classList.toggle('is-inactive', !point);
            row.querySelector('[data-field="speed"]').innerText = point?.speed ? Number(point.speed).toFixed(1) + " kn" : "-";
            row.querySelector('[data-field="course"]').innerText = point?.course ? Math.round(point.course) + "°" : "-";

            // remove old vector if there is one
            if (track.vector) {
                historyLayerGroup.removeLayer(track.vector);
                track.vector = null;
            }

            // no data around this time, hide the boat
            if (!point) {
                historyLayerGroup.removeLayer(track.marker);
                return;
            }

            track.marker.setLatLng([point.latitude, point.longitude]);
            if (point.course != null) {
                track.marker.setRotationAngle(point.course);
            }
            if (!historyLayerGroup.hasLayer(track.marker)) track.marker.addTo(historyLayerGroup);

            const speed = parseFloat(point.speed);
            const course = parseFloat(point.course);

            // draw a new vector if speed is above 0.2 knots
            if (!isNaN(speed) && !isNaN(course) && speed > 0.2) {
                 const distance = speed * 100; // same scale as the live view

                 const startPoint = L.latLng(point.latitude, point.longitude);
                 const endPoint = L.GeometryUtil.destination(startPoint, course, distance);

                 const start = [point.latitude, point.longitude];
                 const end = [endPoint.lat, endPoint.lng];

                 // same color as the boat icon, the trail color is only for the line
                 track.vector = createVectorLayer(start, end, getShipColor(track.name));
                 track.vector.addTo(historyLayerGroup);
            }
        });
    }

    // the green interval playback runs in: the one at fromIndex, or the next one if in a gap
    function getPlaybackRange(fromIndex) {
        const fromTime = historyTimeline[fromIndex];
        return getDataRanges().find(([, e]) => fromTime <= e) || null;
    }

    // where playback stops: the end of the current green interval, or the end of the timeline after the last one
    function getPlaybackEndIndex(fromIndex) {
        const range = getPlaybackRange(fromIndex);
        return range ? findNearestTimelineIndex(range[1]) : historyTimeline.length - 1;
    }

    function togglePlayback() {
        if (isPlaying) stopPlayback(); else startPlayback();
    }

    function startPlayback() {
        const slider = document.getElementById('history-slider');
        let index = findNearestTimelineIndex(parseInt(slider.value));
        if (index === -1) return;

        // already at the end of an interval, restart it from the beginning
        if (index >= getPlaybackEndIndex(index)) {
            const range = getPlaybackRange(index);
            if (!range) return;
            index = findNearestTimelineIndex(range[0]);
            slider.value = historyTimeline[index];
            updateHistoryUI_Render(historyTimeline[index]);
        }

        isPlaying = true;
        updatePlayButton();

        const intervalMs = PLAYBACK_SPEEDS[playbackSpeedIndex] * 1000;
        playbackInterval = setInterval(() => {
            const curIdx = findNearestTimelineIndex(parseInt(document.getElementById('history-slider').value));
            if (curIdx >= getPlaybackEndIndex(curIdx)) {
                stopPlayback();
                return;
            }
            stepHistory(1);
        }, intervalMs);
    }

    function stopPlayback() {
        if (playbackInterval) {
            clearInterval(playbackInterval);
            playbackInterval = null;
        }
        isPlaying = false;
        updatePlayButton();
    }

    function updatePlayButton() {
        // full card and minimized card each have a play button
        ['play-button', 'mini-play-button'].forEach(id => {
            const btn = document.getElementById(id);
            const icon = btn?.querySelector('i');
            if (!icon) return;
            if (isPlaying) {
                icon.className = 'fa-solid fa-pause';
                btn.classList.replace('is-primary', 'is-warning');
            } else {
                icon.className = 'fa-solid fa-play';
                btn.classList.replace('is-warning', 'is-primary');
            }
        });
    }

    function renderSpeedButtons() {
        const container = document.getElementById('speed-buttons');
        if (!container) return;
        container.innerHTML = '';
        PLAYBACK_SPEEDS.forEach((speed, i) => {
            const tag = document.createElement('span');
            tag.className = `tag is-clickable ${i === playbackSpeedIndex ? 'is-primary' : 'is-light'}`;
            tag.textContent = speed + 's';
            tag.onclick = () => setPlaybackSpeed(i);
            container.appendChild(tag);
        });
    }

    function setPlaybackSpeed(index) {
        playbackSpeedIndex = index;
        renderSpeedButtons();
        if (isPlaying) {
            stopPlayback();
            startPlayback();
        }
    }

    function exitHistoryMode() {
        stopPlayback();
        historyLoadId++;
        isHistoryMode = false;
        document.body.classList.remove('history-active');
        historyTracks = [];
        historyTimeline = [];

        document.getElementById('history-controls').style.display = 'none';
        document.getElementById('history-legend').innerHTML = '';

        historyLayerGroup.clearLayers();
        historyLayerGroup.removeFrom(lfmap);

        redrawAllMarkers();
    }

    // MULTI TRAIL PICKER
    let trailPickerBoats = [];    // [{ mmsi, name, lastSeenMs }] from /api/data/latest
    let trailPickerSelected = []; // mmsi in pick order, the order decides the trail color
    let trailPickerDuration = '12h';

    // live WS names by MMSI, cleaned the same way createMarker does
    function liveNamesByMmsi() {
        const names = {};
        Object.values(shipLastUpdate).forEach(message => {
            if (message.mmsi && message.name) names[normalizeMmsi(message.mmsi)] = message.name.split(/[!\[]/)[0].trim();
        });
        return names;
    }

    // known name first, then the live name, otherwise just the MMSI
    function historyBoatName(mmsi, liveNames) {
        return MMSI_NAME_MAP[mmsi] || liveNames[mmsi] || mmsi;
    }

    // Vässarö boats, rescue boats, other named boats, then bare MMSIs
    function trailPickerRank(boat) {
        if (boat.name === boat.mmsi) return 3;
        return { vassaro: 0, rescue: 1 }[getShipCategory(boat.name)] ?? 2;
    }

    async function openMultiTrailPicker() {
        trailPickerSelected = historyTracks.map(track => track.mmsi);
        if (isHistoryMode) trailPickerDuration = historyDurationStr;
        document.getElementById('trail-picker-search').value = '';
        document.getElementById('trail-picker-list').innerHTML = `<p class="has-text-centered has-text-grey is-size-7 p-3">Laddar båtar...</p>`;
        renderTrailPickerDurations();
        updateTrailPickerFooter();
        document.getElementById('multi-trail-modal').classList.add('is-active');
        lfmap.closePopup();
        window.collapsePanelOnMobile();

        try {
            const response = await fetch('https://ais.vassaro.net/api/data/latest');
            if (!response.ok) throw new Error("Kunde inte hämta båtar");
            const vessels = await response.json();
            const liveNames = liveNamesByMmsi();

            trailPickerBoats = vessels.map(vessel => {
                const mmsi = normalizeMmsi(vessel.mmsi);
                let ts = vessel.timestamp;
                if (ts && typeof ts === 'string' && !ts.endsWith('Z') && !ts.includes('+')) ts += 'Z';
                return { mmsi, name: historyBoatName(mmsi, liveNames), lastSeenMs: ts ? new Date(ts).getTime() : 0 };
            }).sort((a, b) => trailPickerRank(a) - trailPickerRank(b) || a.name.localeCompare(b.name, "sv-se"));

            renderTrailPickerList();
        } catch (e) {
            console.error(e);
            document.getElementById('trail-picker-list').innerHTML = `<p class="has-text-centered has-text-danger is-size-7 p-3">Kunde inte hämta båtar.</p>`;
        }
    }

    function closeMultiTrailPicker() {
        document.getElementById('multi-trail-modal').classList.remove('is-active');
    }

    function renderTrailPickerDurations() {
        document.querySelectorAll('#trail-picker-durations .button').forEach(btn => {
            const isSelected = btn.dataset.duration === trailPickerDuration;
            btn.classList.toggle('is-link', isSelected);
            btn.classList.toggle('is-selected', isSelected);
        });
    }

    document.querySelectorAll('#trail-picker-durations .button').forEach(btn => {
        btn.addEventListener('click', () => {
            trailPickerDuration = btn.dataset.duration;
            renderTrailPickerDurations();
            renderTrailPickerList();
        });
    });

    document.getElementById('trail-picker-search').addEventListener('input', renderTrailPickerList);

    function renderTrailPickerList() {
        const list = document.getElementById('trail-picker-list');
        const query = document.getElementById('trail-picker-search').value.trim().toLowerCase();
        // only boats seen inside the chosen window have a trail to show
        const cutoff = Date.now() - durationToHours(trailPickerDuration) * 60 * 60 * 1000;
        const isFull = trailPickerSelected.length >= TRAIL_COLORS.length;

        const boats = trailPickerBoats.filter(boat =>
            (boat.lastSeenMs >= cutoff || trailPickerSelected.includes(boat.mmsi)) &&
            (!query || boat.name.toLowerCase().includes(query) || boat.mmsi.includes(query))
        );

        list.innerHTML = '';
        if (boats.length === 0) {
            list.innerHTML = `<p class="has-text-centered has-text-grey is-size-7 p-3">Inga båtar hittades</p>`;
        }

        boats.forEach(boat => {
            const index = trailPickerSelected.indexOf(boat.mmsi);
            const row = document.createElement('label');
            row.className = 'trail-picker-row';
            row.innerHTML = `
                <input type="checkbox" ${index !== -1 ? 'checked' : ''} ${index === -1 && isFull ? 'disabled' : ''}>
                <span class="trail-dot" style="background: ${index !== -1 ? TRAIL_COLORS[index] : 'transparent'}"></span>
                <span class="trail-picker-name ${trailPickerRank(boat) < 2 ? 'has-text-weight-semibold' : ''}"></span>
                <span class="trail-picker-mmsi">${boat.name !== boat.mmsi ? boat.mmsi : ''}</span>
            `;
            row.querySelector('.trail-picker-name').textContent = boat.name === boat.mmsi ? boat.mmsi : formatName(boat.name);
            row.querySelector('input').addEventListener('change', event => {
                if (event.target.checked) trailPickerSelected.push(boat.mmsi);
                else trailPickerSelected = trailPickerSelected.filter(mmsi => mmsi !== boat.mmsi);
                renderTrailPickerList();
            });
            list.appendChild(row);
        });

        updateTrailPickerFooter();
    }

    function updateTrailPickerFooter() {
        document.getElementById('trail-picker-count').textContent = `${trailPickerSelected.length}/${TRAIL_COLORS.length} valda`;
        document.getElementById('trail-picker-confirm').disabled = trailPickerSelected.length === 0;
    }

    function clearTrailPicker() {
        trailPickerSelected = [];
        renderTrailPickerList();
    }

    function confirmMultiTrail() {
        if (trailPickerSelected.length === 0) return;
        closeMultiTrailPicker();
        const boats = trailPickerSelected.map((mmsi, i) => ({
            mmsi,
            name: trailPickerBoats.find(boat => boat.mmsi === mmsi)?.name
                || historyTracks.find(track => track.mmsi === mmsi)?.name
                || mmsi,
            color: TRAIL_COLORS[i]
        }));
        loadHistoryTracks(boats, trailPickerDuration);
    }

    function updateShipTable() {
        const shipTableBody = document.getElementById("shipTableBody");
        shipTableBody.innerHTML = "";

        const allShips = Object.keys(shipMarkers).sort((a, b) => a.localeCompare(b, "sv-se"));

        const movingShips = [];
        const fixedPoints = [];

        allShips.forEach(shipName => {
            const message = shipLastUpdate[shipName] || {};

            const isConsideredFixed = isFixed(shipName, message);

            if(isConsideredFixed){
                fixedPoints.push(shipName);
            } else {
                movingShips.push(shipName);
            }
        });

        document.getElementById("shipCount").textContent = allShips.length;
        if (allShips.length === 0) {
            shipTableBody.innerHTML = `<tr><td colspan="5" class="has-text-centered has-text-grey">Inga fartyg att visa</td></tr>`;
        }

        movingShips.forEach(shipName => {
            const message = shipLastUpdate[shipName] || {};
            const row = createTableRow(shipName, message);
            shipTableBody.appendChild(row);
        });

        if (showStationary && fixedPoints.length > 0) {
            const headerRow = document.createElement("tr");
            headerRow.innerHTML = `
                <th colspan="5" class="has-text-grey">Fasta punkter</th>
            `;
            shipTableBody.appendChild(headerRow);

            fixedPoints.forEach(shipName => {
                const message = shipLastUpdate[shipName] || {};
                const row = createTableRow(shipName, message);
                shipTableBody.appendChild(row);
            });
        }
    }

    function createTableRow(shipName, message) {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td class="${getShipCategory(shipName) !== "default" ? "has-text-weight-semibold" : ""}">${formatName(shipName)}</td>
            <td class="has-text-right">${renderSpeed(message)}</td>
            <td class="has-text-right">${renderCourse(message)}</td>
            <td class="has-text-right">${renderTime(message)}</td>
            <td class="has-text-right has-text-link"><i class="fa-solid fa-crosshairs"></i></td>
        `;
        row.style.cursor = "pointer";
        row.addEventListener('click', () => focusShip(shipName));
        return row;
    }

    function isFixed(shipName, message) {
        const isRefPoint = shipName.toUpperCase().includes("REF POINT");
        const isStationary = (!message.speed || message.speed === 0)
                && message.legend == "Unspecified" && message.navigationalStatus == "Not defined (default)";
        const isRock = shipName.toUpperCase().includes("GRUND")
        const isVartan = shipName.toUpperCase().includes("VARTAN")
        return isStationary || isRefPoint || isRock || isVartan;
    }

    function focusShip(shipName) {
        const marker = shipMarkers[shipName];
        if (marker) {
            lfmap.setView(marker.getLatLng(), lfmap.getZoom(), { animate: true });
            window.collapsePanelOnMobile();
        }
    }

    function renderSpeed(message) {
        if (message.speed) {
            const rounded = message.speed.toFixed(1);
            return (Number(rounded) > 0.2 ? rounded : 0) + " kn";
        } else {
            return "-";
        }
    }

    function renderCourse(message) {
        if (message.speed) {
            if (Number(message.speed.toFixed(1)) <= 0.2) return "-";
            // small arrow turned to the heading
            return `<i class="fa-solid fa-arrow-up" style="transform: rotate(${message.course}deg)"></i> ${message.course}&deg;`;
        } else {
            return "-";
        }
    }

    function renderTime(message) {
        if (message.lastSeen) {
            let diff = new Date() - new Date(message.lastSeen);

            let ss = Math.floor(diff / 1000) % 60;
            let mm = Math.floor(diff / 1000 / 60) % 60;
            let hh = Math.floor(diff / 1000 / 60 / 60);

            let text = "";
            if (hh > 0) {
                text += `${hh}h`
            }
            if (mm > 0) {
                text += `${mm}m `
            }
            if (ss > 0) {
                text += `${ss}s`
            } else {
                text += `0s`
            }
            return text;
        } else {
            return "-";
        }
    }

    updateShipTable(); // show "Inga fartyg att visa" until the first positions arrive

</script>
